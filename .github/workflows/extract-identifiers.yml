# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Extract identifiers"

on:
  workflow_dispatch:
  push:
    branches:
      - "2.3.x"
    paths:
      - '.github/workflows/extract-identifiers.yml'
      - 'identifier-extractor/**'
      - '.phar-checksum'

concurrency:
  group: extract-identifiers-${{ github.ref }} # will be canceled on subsequent pushes
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extract:
    name: "Extract identifiers"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        repository:
          - "phpstan/phpstan-src"
          - "phpstan/phpstan-strict-rules"
          - "phpstan/phpstan-deprecation-rules"
          - "phpstan/phpstan-doctrine"
          - "phpstan/phpstan-symfony"
          - "phpstan/phpstan-phpunit"
          - "phpstan/phpstan-nette"
          - "phpstan/phpstan-dibi"
          #- "phpstan/phpstan-php-parser"
          - "phpstan/phpstan-beberlei-assert"
          - "phpstan/phpstan-webmozart-assert"
          - "phpstan/phpstan-mockery"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          path: "identifier-extractor/repo"
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.4"

      - name: "Install Extractor dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0
        with:
          working-directory: "identifier-extractor"

      - name: "Repository name"
        id: repo-name
        env:
          REPO: ${{ matrix.repository }}
        run: echo "name=$(basename "$REPO")" >> "$GITHUB_OUTPUT"

      - name: "Branch name"
        id: branch-name
        working-directory: "identifier-extractor/repo"
        run: echo "name=$(git branch --show)" >> "$GITHUB_OUTPUT"

      - name: "Extract"
        working-directory: "identifier-extractor/repo"
        run: |
          set -o pipefail
          ../../phpstan analyse -c ../extractor.neon -a ../vendor/autoload.php | tee "../${REPO_NAME}.json"
        env:
          REPO: ${{ matrix.repository }}
          BRANCH: ${{ steps.branch-name.outputs.name }}
          REPO_NAME: ${{ steps.repo-name.outputs.name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: identifiers-${{ steps.repo-name.outputs.name }}
          path: identifier-extractor/${{ steps.repo-name.outputs.name }}.json

  merge:
    permissions:
      contents: write  # for stefanzweifel/git-auto-commit-action to push code in repo
    name: "Merge and commit identifiers"
    needs: extract

    runs-on: "ubuntu-latest"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          persist-credentials: true # zizmor: ignore[artipacked] git-auto-commit-action pushes with these credentials

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.4"

      - name: "Install Extractor dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0
        with:
          working-directory: "identifier-extractor"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: identifiers-*
          path: identifier-extractor/tmp

      - name: "Merge"
        working-directory: "identifier-extractor"
        run: "php merge.php > ../website/src/errorsIdentifiers.json"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PHPSTANBOT_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PHPSTANBOT_KEY_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: "Commit changes"
        uses: "stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c" # v7.2.1
        id: "commit"
        with:
          commit_message: "Update errors identifiers"
          commit_user_name: "phpstan-bot"
          commit_user_email: "ondrej+phpstanbot@mirtes.cz"
          commit_author: "phpstan-bot <ondrej+phpstanbot@mirtes.cz>"
          commit_options: "--gpg-sign"
