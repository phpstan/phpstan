# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Website Infra"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/website-infra.yml'
      - 'website/infra/**'
  push:
    branches:
      - "2.2.x"
    paths:
      - '.github/workflows/website-infra.yml'
      - 'website/infra/**'

# Deploys must be serialized — CloudFront / CFN do not tolerate concurrent
# updates of the same stack.
concurrency: website-infra

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "Install Node"
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/infra/package-lock.json

      - name: "Install dependencies"
        working-directory: ./website/infra
        run: "npm ci"

      - name: "TypeScript check"
        working-directory: ./website/infra
        run: "npm run check"

      - name: "Unit tests"
        working-directory: ./website/infra
        run: "npm test"

      - name: "CDK synth"
        working-directory: ./website/infra
        run: "npx cdk synth --all --quiet"

  deploy:
    name: "Deploy"
    runs-on: "ubuntu-latest"
    needs: test
    if: "github.event_name == 'push' && github.ref == 'refs/heads/2.2.x'"
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "Install Node"
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/infra/package-lock.json

      - name: "Install dependencies"
        working-directory: ./website/infra
        run: "npm ci"

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: "CDK deploy"
        working-directory: ./website/infra
        run: "npx cdk deploy --all --require-approval never"
