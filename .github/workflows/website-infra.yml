# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Website Infra"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/website-infra.yml'
      - 'website/infra/**'
  push:
    branches:
      - "2.2.x"
    paths:
      - '.github/workflows/website-infra.yml'
      - 'website/infra/**'

# Deploys must be serialized — CloudFront / CFN do not tolerate concurrent
# updates of the same stack.
concurrency: website-infra

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "Install Node"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/infra/package-lock.json

      - name: "Install dependencies"
        working-directory: ./website/infra
        run: "npm ci"

      - name: "TypeScript check"
        working-directory: ./website/infra
        run: "npm run check"

      - name: "Unit tests"
        working-directory: ./website/infra
        run: "npm test"

      - name: "CDK synth"
        working-directory: ./website/infra
        run: "npx cdk synth --all --quiet"

  deploy:
    name: "Deploy"
    runs-on: "ubuntu-latest"
    needs: test
    if: "github.event_name == 'push' && github.ref == 'refs/heads/2.2.x'"
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "Install Node"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/infra/package-lock.json

      - name: "Install dependencies"
        working-directory: ./website/infra
        run: "npm ci"

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: "CDK deploy"
        working-directory: ./website/infra
        run: "npx cdk deploy --all --require-approval never"
