# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Website Infra"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/website-infra.yml'
      - 'website/infra/**'
  push:
    branches:
      - "2.3.x"
    paths:
      - '.github/workflows/website-infra.yml'
      - 'website/infra/**'

# Deploys must be serialized — CloudFront / CFN do not tolerate concurrent
# updates of the same stack. Pull request runs only test, so a new push to
# the pull request cancels the previous run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('website-infra-pr-{0}', github.event.pull_request.number) || 'website-infra' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/infra/package-lock.json

      - name: "Install dependencies"
        working-directory: ./website/infra
        run: "npm ci"

      - name: "TypeScript check"
        working-directory: ./website/infra
        run: "npm run check"

      - name: "Unit tests"
        working-directory: ./website/infra
        run: "npm test"

      - name: "CDK synth"
        working-directory: ./website/infra
        run: "npx cdk synth --all --quiet"

  deploy:
    name: "Deploy"
    runs-on: "ubuntu-latest"
    needs: test
    if: "github.event_name == 'push' && github.ref == 'refs/heads/2.3.x'"
    permissions:
      id-token: write # to assume the AWS deploy role via OIDC
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/infra/package-lock.json

      - name: "Install dependencies"
        working-directory: ./website/infra
        run: "npm ci"

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: "CDK deploy"
        working-directory: ./website/infra
        run: "npx cdk deploy --all --require-approval never"
