# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Website Infra"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/website-infra.yml'
      - 'website/infra/**'
  push:
    branches:
      - "2.2.x"
    paths:
      - '.github/workflows/website-infra.yml'
      - 'website/infra/**'

# Deploys must be serialized — CloudFront / CFN do not tolerate concurrent
# updates of the same stack.
concurrency: website-infra

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: "Install Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/infra/package-lock.json

      - name: "Install dependencies"
        working-directory: ./website/infra
        run: "npm ci"

      - name: "TypeScript check"
        working-directory: ./website/infra
        run: "npm run check"

      - name: "Unit tests"
        working-directory: ./website/infra
        run: "npm test"

      - name: "CDK synth"
        working-directory: ./website/infra
        run: "npx cdk synth --all --quiet"

  deploy:
    name: "Deploy"
    runs-on: "ubuntu-latest"
    needs: test
    if: "github.event_name == 'push' && github.ref == 'refs/heads/2.2.x'"
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: "Install Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/infra/package-lock.json

      - name: "Install dependencies"
        working-directory: ./website/infra
        run: "npm ci"

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: "CDK deploy"
        working-directory: ./website/infra
        run: "npx cdk deploy --all --require-approval never"
