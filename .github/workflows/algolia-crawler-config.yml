name: "Algolia Crawler Config Update"

on:
  push:
    branches:
      - "2.3.x"
    paths:
      - '.github/workflows/algolia-crawler-config.json'
      - '.github/workflows/algolia-crawler-config.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-config:
    name: "Update Algolia Crawler Config"
    runs-on: "ubuntu-latest"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Update Crawler Config"
        env:
          CRAWLER_API_KEY: ${{ secrets.ALGOLIA_CRAWLER_CRAWLER_API_KEY }}
          CRAWLER_ID: ${{ secrets.ALGOLIA_CRAWLER_ID }}
          CRAWLER_USER_ID: ${{ secrets.ALGOLIA_CRAWLER_USER_ID }}
          API_KEY: ${{ secrets.ALGOLIA_CRAWLER_API_KEY }}
        run: |
          jq --arg key "$CRAWLER_API_KEY" '.apiKey = $key' .github/workflows/algolia-crawler-config.json | \
          curl -X PATCH "https://crawler.algolia.com/api/1/crawlers/${CRAWLER_ID}/config" \
            -H "Content-Type: application/json" \
            -u "${CRAWLER_USER_ID}:${API_KEY}" \
            -d @-

      # The crawler applies initialIndexSettings only when it creates the index, so push them to the existing one
      - name: "Update Index Settings"
        env:
          CRAWLER_API_KEY: ${{ secrets.ALGOLIA_CRAWLER_CRAWLER_API_KEY }}
        run: |
          APP_ID=$(jq -r '.appId' .github/workflows/algolia-crawler-config.json)
          jq '.initialIndexSettings.phpstan' .github/workflows/algolia-crawler-config.json | \
          curl --fail-with-body -X PUT "https://${APP_ID}.algolia.net/1/indexes/phpstan/settings" \
            -H "Content-Type: application/json" \
            -H "X-Algolia-Application-Id: ${APP_ID}" \
            -H "X-Algolia-API-Key: ${CRAWLER_API_KEY}" \
            -d @-

      - name: "Trigger Crawler Reindex"
        env:
          CRAWLER_ID: ${{ secrets.ALGOLIA_CRAWLER_ID }}
          CRAWLER_USER_ID: ${{ secrets.ALGOLIA_CRAWLER_USER_ID }}
          API_KEY: ${{ secrets.ALGOLIA_CRAWLER_API_KEY }}
        run: |
          curl -X POST "https://crawler.algolia.com/api/1/crawlers/${CRAWLER_ID}/reindex" \
            -H "Content-Type: application/json" \
            -u "${CRAWLER_USER_ID}:${API_KEY}"
