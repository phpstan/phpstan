name: "Claude React On Review" # zizmor: ignore[concurrency-limits] each run saves the context of a different review

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  save-context:
    name: "Save review context"
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'phpstan-bot'
      && github.event.review.user.login != 'phpstan-bot'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Save review context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          echo "$PR_NUMBER" > pr_number.txt
          echo "$REVIEW_ID" > review_id.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-context
          path: |
            pr_number.txt
            review_id.txt
