# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: Generate Sponsors

on:
  workflow_dispatch:
  schedule:
    - cron: 15 14 * * *
  push:
    branches:
      - "2.3.x"
    paths:
      - '.github/workflows/sponsors.yml'
      - 'BACKERS.md'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sponsors:
    name: "Generate Sponsors"
    runs-on: ubuntu-latest
    env:
      SPONSOR_TEMPLATE: "<li><a href=\"https://github.com/{{{ login }}}\">{{{ name }}} ({{{ login }}})</a></li>\n"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      -
        name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PHPSTANBOT_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PHPSTANBOT_KEY_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          persist-credentials: true # zizmor: ignore[artipacked] git-auto-commit-action pushes with these credentials

      - name: Generate Sponsors
        uses: ondrejmirtes/github-sponsors-readme-action@9fd59795af9477235df8f234f962ef3dd854592f # v1.2.2.3
        with:
          token: ${{ secrets.SPONSORS_PAT }}
          file: 'BACKERS.md'
          minimum: 500
          maximum: 2999
          marker: 'indi'
          template: ${{ env.SPONSOR_TEMPLATE }}

      - name: Generate Sponsors
        uses: ondrejmirtes/github-sponsors-readme-action@9fd59795af9477235df8f234f962ef3dd854592f # v1.2.2.3
        with:
          token: ${{ secrets.SPONSORS_PAT }}
          file: 'BACKERS.md'
          minimum: 500
          maximum: 2999
          organization: true
          marker: 'indi-org'
          template: ${{ env.SPONSOR_TEMPLATE }}

      - name: Generate Sponsors
        uses: ondrejmirtes/github-sponsors-readme-action@9fd59795af9477235df8f234f962ef3dd854592f # v1.2.2.3
        with:
          token: ${{ secrets.SPONSORS_PAT }}
          file: 'BACKERS.md'
          minimum: 3000
          maximum: 9999
          marker: 'small'
          template: ${{ env.SPONSOR_TEMPLATE }}

      - name: Generate Sponsors
        uses: ondrejmirtes/github-sponsors-readme-action@9fd59795af9477235df8f234f962ef3dd854592f # v1.2.2.3
        with:
          token: ${{ secrets.SPONSORS_PAT }}
          file: 'BACKERS.md'
          minimum: 3000
          maximum: 9999
          organization: true
          marker: 'small-org'
          template: ${{ env.SPONSOR_TEMPLATE }}

      - name: Generate Sponsors
        uses: ondrejmirtes/github-sponsors-readme-action@9fd59795af9477235df8f234f962ef3dd854592f # v1.2.2.3
        with:
          token: ${{ secrets.SPONSORS_PAT }}
          file: 'BACKERS.md'
          minimum: 10000
          maximum: 32999
          marker: 'bronze'
          template: ${{ env.SPONSOR_TEMPLATE }}

      - name: Generate Sponsors
        uses: ondrejmirtes/github-sponsors-readme-action@9fd59795af9477235df8f234f962ef3dd854592f # v1.2.2.3
        with:
          token: ${{ secrets.SPONSORS_PAT }}
          file: 'BACKERS.md'
          minimum: 10000
          maximum: 32999
          organization: true
          marker: 'bronze-org'
          template: ${{ env.SPONSOR_TEMPLATE }}

      - name: Generate Sponsors
        uses: ondrejmirtes/github-sponsors-readme-action@9fd59795af9477235df8f234f962ef3dd854592f # v1.2.2.3
        with:
          token: ${{ secrets.SPONSORS_PAT }}
          file: 'BACKERS.md'
          minimum: 33000
          maximum: 49999
          marker: 'silver'
          template: ${{ env.SPONSOR_TEMPLATE }}

      - name: Generate Sponsors
        uses: ondrejmirtes/github-sponsors-readme-action@9fd59795af9477235df8f234f962ef3dd854592f # v1.2.2.3
        with:
          token: ${{ secrets.SPONSORS_PAT }}
          file: 'BACKERS.md'
          minimum: 33000
          maximum: 49999
          organization: true
          marker: 'silver-org'
          template: ${{ env.SPONSOR_TEMPLATE }}

      - name: Generate Sponsors
        uses: ondrejmirtes/github-sponsors-readme-action@9fd59795af9477235df8f234f962ef3dd854592f # v1.2.2.3
        with:
          token: ${{ secrets.SPONSORS_PAT }}
          file: 'BACKERS.md'
          minimum: 50000
          marker: 'gold'
          template: ${{ env.SPONSOR_TEMPLATE }}

      - name: Generate Sponsors
        uses: ondrejmirtes/github-sponsors-readme-action@9fd59795af9477235df8f234f962ef3dd854592f # v1.2.2.3
        with:
          token: ${{ secrets.SPONSORS_PAT }}
          file: 'BACKERS.md'
          minimum: 50000
          organization: true
          marker: 'gold-org'
          template: ${{ env.SPONSOR_TEMPLATE }}

      - name: "Commit changes"
        uses: "stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c" # v7.2.1
        id: "commit"
        with:
          commit_message: "Update BACKERS.md"
          commit_user_name: "phpstan-bot"
          commit_user_email: "ondrej+phpstanbot@mirtes.cz"
          commit_author: "phpstan-bot <ondrej+phpstanbot@mirtes.cz>"
          commit_options: "--gpg-sign"

      - name: "Slack Notification"
        if: steps.commit.outputs.changes_detected == 'true'
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_CHANNEL: sponsors
          SLACK_MESSAGE: 'https://github.com/phpstan/phpstan/commit/${{ steps.commit.outputs.commit_hash }}'
          SLACK_TITLE: Sponsors changed!
          SLACK_USERNAME: phpstan
          SLACK_WEBHOOK: ${{ secrets.SLACK_SPONSORS_WEBHOOK }}
          MSG_MINIMAL: true
