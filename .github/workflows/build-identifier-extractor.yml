# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Build Identifier Extractor"

on:
  pull_request:
    paths:
      - 'identifier-extractor/**'
      - '.github/workflows/build-identifier-extractor.yml'
  push:
    branches:
      - "2.3.x"
    paths:
      - 'identifier-extractor/**'
      - '.github/workflows/build-identifier-extractor.yml'

permissions:
  contents: read

jobs:
  build-identifier-extractor:
    name: "Build Identifier Extractor"

    runs-on: "ubuntu-latest"
    timeout-minutes: 60

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.1"

      - name: "Install Extractor dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0
        with:
          working-directory: "identifier-extractor"

      - name: "PHPStan"
        working-directory: "identifier-extractor"
        run: ../phpstan
