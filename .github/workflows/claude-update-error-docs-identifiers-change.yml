name: "Claude Update Error Docs" # zizmor: ignore[concurrency-limits] each run dispatches docs update for a specific commit

on:
  push:
    branches:
      - "2.3.x"
    paths:
      - '.github/workflows/claude-update-error-docs-identifiers-change.yml'
      - 'website/src/errorsIdentifiers.json'

permissions: {}

jobs:
  fix:
    name: "Trigger Claude Update Error Docs"
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Trigger Claude Update Error Docs
        env:
          GH_TOKEN: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          SHA: ${{ github.sha }}
        run: gh workflow run claude-update-error-docs.yml -f sha="$SHA" --repo phpstan-bot/phpstan
