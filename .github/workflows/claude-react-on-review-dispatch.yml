name: "Claude React On Review Dispatch"

on:
  workflow_run:
    workflows: ["Claude React On Review"]
    types: [completed]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download review context
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: review-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Claude PR Review
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PHPSTAN_BOT_TOKEN }}
        run: |
          pr_number=$(cat pr_number.txt)
          review_id=$(cat review_id.txt)
          gh workflow run claude-pr-review.yml \
            -f pr_number="$pr_number" \
            -f review_id="$review_id" \
            --repo phpstan-bot/phpstan
