name: "Claude Easy Fix on Milestone"

on:
  issues:
    types: [milestoned]

jobs:
  fix:
    if: github.event.milestone.title == 'Easy fixes'
    uses: phpstan/phpstan-src/.github/workflows/claude-fix-issue.yml@2.2.x
    with:
      issue-number: ${{ github.event.issue.number }}
    secrets: inherit
