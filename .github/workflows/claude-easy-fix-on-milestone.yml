name: "Claude Easy Fix on Milestone" # zizmor: ignore[concurrency-limits] each run dispatches a fix for a different issue

on:
  issues:
    types: [milestoned]

permissions: {}

jobs:
  fix:
    name: "Trigger Claude fix"
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Trigger Claude Random Easy Fixes
        env:
          GH_TOKEN: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh workflow run claude-fix-issue.yml -f issue-number="$ISSUE_NUMBER" -f target-branch=2.3.x --repo phpstan-bot/phpstan-src
