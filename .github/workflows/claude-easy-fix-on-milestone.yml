name: "Claude Easy Fix on Milestone"

on:
  issues:
    types: [milestoned]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Trigger Claude Random Easy Fixes
        env:
          GH_TOKEN: ${{ secrets.PHPSTAN_BOT_TOKEN }}
        run: gh workflow run claude-fix-issue.yml -f issue-number=${{ github.event.issue.number }} --repo phpstan-bot/phpstan-src
