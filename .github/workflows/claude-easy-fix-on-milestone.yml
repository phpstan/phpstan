name: "Claude Easy Fix on Milestone"

on:
  issues:
    types: [milestoned]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Trigger Claude Random Easy Fixes
        env:
          GH_TOKEN: ${{ secrets.PHPSTAN_BOT_TOKEN }}
        run: gh workflow run claude-fix-issue.yml -f issue-number=${{ github.event.issue.number }} -f target-branch=2.3.x --repo phpstan-bot/phpstan-src
