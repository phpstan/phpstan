name: "Claude Easy Fix on Milestone" # zizmor: ignore[concurrency-limits] each run dispatches a fix for a different issue

on:
  issues:
    types: [milestoned]

permissions: {}

jobs:
  fix:
    name: "Trigger Claude fix"
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Trigger Claude Random Easy Fixes
        env:
          GH_TOKEN: ${{ secrets.PHPSTAN_BOT_FORK_DISPATCH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh workflow run claude-fix-issue.yml -f issue-number="$ISSUE_NUMBER" -f target-branch=2.3.x --repo phpstan-bot/phpstan-src
