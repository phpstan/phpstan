# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Extension tests" # zizmor: ignore[concurrency-limits] concurrency is set by the calling workflow

on:
  workflow_call:
    inputs:
      ref:
        description: 'phpstan/phpstan ref to checkout'
        required: true
        type: string
      phar-checksum:
        description: 'PHAR checksum from reproducible build (please rebase)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-phar-checksum:
    name: "Check PHAR checksum"
    runs-on: "ubuntu-latest"
    outputs:
      checksum-result: ${{ steps.checksum-difference.outputs.result }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: "Check PHAR checksum"
        id: checksum-difference
        env:
          CHECKSUM: ${{ inputs.phar-checksum }}
        run: |
          if [[ $(head -n 1 .phar-checksum) != "$CHECKSUM" ]]; then
            echo "result=different" >> "$GITHUB_OUTPUT"
          else
            echo "result=same" >> "$GITHUB_OUTPUT"
          fi

  tests-extensions:
    name: "${{ matrix.extension-name }} (${{ matrix.php-version }}) ${{ matrix.script }}"

    runs-on: "ubuntu-latest"

    needs: check-phar-checksum
    if: "needs.check-phar-checksum.outputs.checksum-result == 'different'"

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"
        extension-name:
          - "phpstan-phpunit"
          - "phpstan-strict-rules"
          - "phpstan-mockery"
          - "phpstan-doctrine"
          - "phpstan-symfony"
          - "phpstan-deprecation-rules"
          - "phpdoc-parser"
          - "phpstan-nette"
          - "phpstan-dibi"
          - "phpstan-webmozart-assert"
          - "phpstan-beberlei-assert"
        script:
          - "make tests"
          - "make phpstan"
        exclude:
          - extension-name: "phpstan-doctrine"
            php-version: "8.3"
          - extension-name: "phpstan-doctrine"
            php-version: "8.4"
          - extension-name: "phpstan-doctrine"
            php-version: "8.5"
          - extension-name: "phpstan-doctrine"
            php-version: "8.6"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          ini-file: development
          ini-values: memory_limit=768M
          extensions: soap

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Download phpstan.phar"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phar-file

      - name: "Download turbo extension"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: turbo-ext-files
          path: turbo-ext

      - name: "Parse extension entry"
        id: extension
        env:
          EXTENSION_ENTRY: ${{ matrix.extension-name }}
        run: |
          entry="$EXTENSION_ENTRY"
          name="${entry%% *}"
          ref=""
          if [[ "$entry" == *' '* ]]; then
            ref="${entry#* }"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: "Checkout extension"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "phpstan/${{ steps.extension.outputs.name }}"
          ref: ${{ steps.extension.outputs.ref }}
          path: extension
          persist-credentials: false

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0
        with:
          working-directory: "extension"
          # development dependencies of the extensions (e.g. nette/schema) do not allow PHP 8.6 yet
          composer-options: "${{ matrix.php-version == '8.6' && '--ignore-platform-req=php+' || '' }}"

      - name: "Copy current PHAR"
        working-directory: extension
        run: |
          cp ../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
          cp ../phpstan vendor/phpstan/phpstan/phpstan
          cp ../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
          rm -rf vendor/phpstan/phpstan/turbo-ext
          cp -R ../turbo-ext vendor/phpstan/phpstan/turbo-ext

      - name: "Script"
        working-directory: extension
        run: "${{ matrix.script }}" # zizmor: ignore[template-injection] scripts are defined statically in the matrix
