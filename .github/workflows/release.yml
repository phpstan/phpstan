# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Create release"

on:
  push:
    tags:
      - '*'

concurrency: release # zizmor: ignore[concurrency-limits] releases must not cancel each other

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: write  # for softprops/action-gh-release to create GitHub release
    name: "Deploy"
    runs-on: "ubuntu-latest"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Create release"
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        id: release
        with:
          token: ${{ secrets.PHPSTAN_BOT_CONTENTS_TOKEN }}
          draft: true
          discussion_category_name: "General"
          files: |
            phpstan.phar
            phpstan.phar.asc

      - name: "Print release URL"
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: echo "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
