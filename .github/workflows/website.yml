# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Website Build"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/website.yml'
      - 'website/**'
      - '!website/infra/**'
  push:
    branches:
      - "2.2.x"
    paths:
      - '.github/workflows/website.yml'
      - 'website/**'
      - '!website/infra/**'

jobs:
  typescript-check:
    name: "TypeScript check"
    runs-on: "ubuntu-latest"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: "Install Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: "Install dependencies"
        working-directory: ./website
        run: "npm ci"

      - name: "TypeScript check"
        working-directory: ./website
        run: "npm run check"

  build:
    name: "Build"
    runs-on: "ubuntu-latest"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: "Install Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: "Install PHP"
        uses: "shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc" # v2
        with:
          coverage: "none"
          php-version: "8.0"

      - name: "Install dependencies"
        working-directory: ./website
        run: "npm ci"

      - name: "Put release into release.txt"
        working-directory: ./website
        run: echo -n "$(git rev-parse --short HEAD)" > src/release.txt

      - name: "Build"
        working-directory: ./website
        run: "npm run build"

      - name: "Upload website dist"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "website-dist"
          path: website/dist

  visual-regression:
    name: "Visual Regression Tests"
    runs-on: "ubuntu-latest"
    needs: build

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: "Install Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: "Download website dist"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website-dist
          path: website/dist

      - name: "Install dependencies"
        working-directory: ./website
        run: "npm ci"

      - name: "Install Playwright browsers"
        working-directory: ./website
        run: "npx playwright install --with-deps chromium"

      - name: "Run visual regression tests"
        working-directory: ./website
        run: "npm run test:visual"

      - name: "Upload test results"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: visual-regression-results
          path: website/visual-tests/test-results/
          retention-days: 30

      - name: "Update screenshots"
        working-directory: ./website
        if: failure()
        run: "npm run test:visual:update"

      - name: "Upload screenshots"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: visual-regression-screenshots
          path: website/visual-tests/__screenshots__/
          retention-days: 30

      - name: "Create Pull Request"
        if: "failure() && github.event_name == 'push'"
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          add-paths: |
            website/visual-tests/__screenshots__/
          branch: "create-pull-request/visual-tests"
          delete-branch: true
          title: "Update visual tests screenshots"
          commit-message: "Update visual tests screenshots"
          committer: "phpstan-bot <ondrej+phpstanbot@mirtes.cz>"

  deploy:
    name: "Deploy"
    needs:
      - typescript-check
      - build
      - visual-regression
    if: "github.ref == 'refs/heads/2.2.x'"
    runs-on: "ubuntu-latest"
    concurrency: website
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Download website dist"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website-dist
          path: dist

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.WEBSITE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: "Sync with S3"
        run: |
          aws s3 sync ./dist "s3://${{ vars.WEBSITE_BUCKET }}" \
            --exclude '.git*/*' \
            --exclude '*.map' \
            --follow-symlinks

      - name: "Invalidate CloudFront"
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.WEBSITE_DISTRIBUTION_ID }}" \
            --paths '/*'

      - name: "Trigger Algolia Crawler"
        run: |
          curl -X POST "https://crawler.algolia.com/api/1/crawlers/${{ secrets.ALGOLIA_CRAWLER_ID }}/reindex" \
            -H "Content-Type: application/json" \
            -u "${{ secrets.ALGOLIA_CRAWLER_USER_ID }}:${{ secrets.ALGOLIA_CRAWLER_API_KEY }}"

      - uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          event-type: check_website_links

  sentry-release:
    name: "Create Sentry release"
    needs:
      - deploy
    runs-on: "ubuntu-latest"
    concurrency: website
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: "Download website dist"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website-dist
          path: dist

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Sentry release
        uses: getsentry/action-release@a74facf8a080ecbdf1cb355f16743530d712abb7 # v1.11.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ steps.vars.outputs.sha_short }}
          sourcemaps: './dist'
          url_prefix: "https://phpstan.org"
          ignore_missing: true
          ignore_empty: true
