# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Extension tests"

on:
  pull_request:
    paths:
      - '.github/workflows/extension-tests.yml'
      - '.github/workflows/extension-tests-run.yml'
      - 'phpstan'
      - '.phar-checksum'
      - 'bootstrap.php'
  push:
    branches:
      - "2.3.x"
    paths:
      - '.github/workflows/extension-tests.yml'
      - '.github/workflows/extension-tests-run.yml'
      - 'phpstan'
      - '.phar-checksum'
      - 'bootstrap.php'

jobs:
  upload-phar:
    runs-on: "ubuntu-latest"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phar-file
          path: phpstan.phar

      # The reusable workflow downloads the turbo extension binaries as an
      # artifact next to the phar; upload the committed ones (the placeholder
      # keeps the artifact valid before the first binaries land).
      - name: "Prepare turbo extension files"
        run: mkdir -p turbo-ext && touch turbo-ext/placeholder

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-ext-files
          path: turbo-ext
  extension-tests:
    needs: upload-phar
    uses: ./.github/workflows/extension-tests.yml
    with:
      ref: ${{ github.ref }}
      phar-checksum: "always"
