name: "Claude React on comment"

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: claude-pr-reactions-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  check-trigger:
    name: "Check trigger phrase"
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      triggered: ${{ steps.check.outputs.triggered }}
    steps:
      - name: "Check for trigger phrase"
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body || '' }}
        run: |
          if echo "$COMMENT_BODY" | grep -qF "@phpstan-bot"; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi

  react:
    name: "React on comment"
    needs: check-trigger
    if: needs.check-trigger.outputs.triggered == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PHPSTAN_BOT_TOKEN }}

      - name: "React to feedback"
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          trigger_phrase: "@phpstan-bot"
          claude_args: "--model claude-opus-4-6"
          bot_name: "phpstan-bot"
          bot_id: "79867460"
          additional_permissions: |
            actions: read

  list-issues:
    name: "List recent issues"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      has_issues: ${{ steps.list.outputs.has_issues }}
    steps:
      - name: "List last 100 recently opened issues mentioning @phpstan-bot"
        id: list
        env:
          GH_TOKEN: ${{ secrets.PHPSTAN_BOT_TOKEN }}
        run: |
          issues=$(gh issue list --repo "${{ github.repository }}" --sort created --limit 100 --json number,body --jq '[.[] | select((.body // "") | contains("@phpstan-bot")) | .number]')
          count=$(echo "$issues" | jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "has_issues=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"issue_number\":$issues}" >> "$GITHUB_OUTPUT"
          else
            echo "has_issues=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"issue_number\":[0]}" >> "$GITHUB_OUTPUT"
          fi

  react-batch:
    name: "React to issue #${{ matrix.issue_number }}"
    needs: list-issues
    if: github.event_name == 'workflow_dispatch' && needs.list-issues.outputs.has_issues == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix: ${{ fromJson(needs.list-issues.outputs.matrix) }}
      max-parallel: 5
      fail-fast: false

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PHPSTAN_BOT_TOKEN }}

      - name: "Prepare issue event context"
        env:
          GH_TOKEN: ${{ secrets.PHPSTAN_BOT_TOKEN }}
        run: |
          # Fetch full issue data and create a synthetic issues.opened event payload
          gh api "repos/${{ github.repository }}/issues/${{ matrix.issue_number }}" | jq '{action: "opened", issue: .}' > "$GITHUB_EVENT_PATH"
          # Override event name so the action detects this as an issues event
          echo "GITHUB_EVENT_NAME=issues" >> "$GITHUB_ENV"

      - name: "React to feedback"
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          trigger_phrase: "@phpstan-bot"
          claude_args: "--model claude-opus-4-6"
          bot_name: "phpstan-bot"
          bot_id: "79867460"
          additional_permissions: |
            actions: read
