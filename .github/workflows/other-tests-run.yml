# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Other tests"

on:
  pull_request:
    paths:
      - '.github/workflows/other-tests.yml'
      - '.github/workflows/other-tests-run.yml'
      - 'e2e/**'
      - 'phpstan'
      - '.phar-checksum'
      - 'bootstrap.php'
  push:
    branches:
      - "2.2.x"
    paths:
      - '.github/workflows/other-tests.yml'
      - '.github/workflows/other-tests-run.yml'
      - 'e2e/**'
      - 'phpstan'
      - '.phar-checksum'
      - 'bootstrap.php'

jobs:
  upload-phar:
    runs-on: "ubuntu-latest"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phar-file
          path: phpstan.phar

      # The reusable workflow downloads the turbo extension binaries as an
      # artifact next to the phar; upload the committed ones (the placeholder
      # keeps the artifact valid before the first binaries land).
      - name: "Prepare turbo extension files"
        run: mkdir -p turbo-ext && touch turbo-ext/placeholder

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-ext-files
          path: turbo-ext
  other-tests:
    needs: upload-phar
    uses: ./.github/workflows/other-tests.yml
    with:
      ref: ${{ github.ref }}
      phar-checksum: "always"
