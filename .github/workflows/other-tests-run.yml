# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Other tests"

on:
  pull_request:
    paths:
      - '.github/workflows/other-tests.yml'
      - '.github/workflows/other-tests-run.yml'
      - 'e2e/**'
      - 'phpstan'
      - '.phar-checksum'
      - 'bootstrap.php'
  push:
    branches:
      - "2.3.x"
    paths:
      - '.github/workflows/other-tests.yml'
      - '.github/workflows/other-tests-run.yml'
      - 'e2e/**'
      - 'phpstan'
      - '.phar-checksum'
      - 'bootstrap.php'

jobs:
  upload-phar:
    runs-on: "ubuntu-latest"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phar-file
          path: phpstan.phar

      # The reusable workflow downloads the turbo extension binaries as an
      # artifact next to the phar; upload the committed ones (the placeholder
      # keeps the artifact valid before the first binaries land).
      - name: "Prepare turbo extension files"
        run: mkdir -p turbo-ext && touch turbo-ext/placeholder

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-ext-files
          path: turbo-ext
  other-tests:
    needs: upload-phar
    uses: ./.github/workflows/other-tests.yml
    with:
      ref: ${{ github.ref }}
      phar-checksum: "always"
