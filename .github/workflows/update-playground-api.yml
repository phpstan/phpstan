# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Update playground API"

on:
  push:
    branches:
      - "2.3.x"
    paths:
      - '.github/workflows/update-playground-api.yml'
      - 'playground-api/**'

concurrency: playground_api

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: playground-api/package-lock.json

      - name: "Install dependencies"
        working-directory: ./playground-api
        run: "npm ci"

      - name: "Check"
        working-directory: ./playground-api
        run: "npm run check"

      - name: "Deploy"
        working-directory: ./playground-api
        env:
          AWS_DEFAULT_REGION: "eu-west-1"
          AWS_ACCESS_KEY_ID: ${{ secrets.PLAYGROUND_RUNNER_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PLAYGROUND_RUNNER_AWS_SECRET_ACCESS_KEY }}
          HONEYBADGER_API_KEY: ${{ secrets.HONEYBADGER_PLAYGROUND_API_API_KEY }}
        run: "npm run deploy"
