          - php-version: 8.4
            repo: PHPCSStandards/PHP_CodeSniffer
            ref: c17bea2b241d09596accb728e097de010a002c8a
            setup: |
              composer install
            phpstan-command: ../../../phpstan.phar analyse -c ../phpcs.neon
            baseline-file: phpcs-baseline.neon
          - php-version: 8.5
            repo: neos/neos-development-collection
            ref: f7ec86e9eb67f7b01f38fbc30d332d7eef20c8dc
            phpstan-cwd: e2e/integration/neos-dist
            setup: |
              # Neos is a monorepo package collection. PHPStan must run from
              # within a Neos distribution where the collection is split into
              # Packages/Neos and the Flow framework into Packages/Framework
              # (its phpstan.neon.dist references ../Framework/bootstrap-phpstan.php).
              # This mirrors how Neos runs PHPStan in its own CI:
              # https://github.com/neos/neos-development-collection/blob/9.3/.github/workflows/build.yml
              git checkout -b build
              git clone https://github.com/neos/neos-development-distribution.git ../neos-dist
              cd ../neos-dist
              git checkout 44d757ce1936bd2e2f951dff02407db9e33a2506
              composer config repositories.neos '{ "type": "path", "url": "../repo", "options": { "symlink": false } }'
              composer require --no-update neos/neos-development-collection:"dev-build as 9.3.x-dev"
              composer update --no-progress --no-interaction
              cp ../../../phpstan.phar Packages/Libraries/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan Packages/Libraries/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php Packages/Libraries/phpstan/phpstan/bootstrap.php
              rm -rf Packages/Libraries/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext Packages/Libraries/phpstan/phpstan/turbo-ext
              # Flow's bootstrap (run by bootstrap-phpstan.php in every parallel
              # worker) creates these directories non-atomically and exits on a
              # lost mkdir race - create them upfront.
              mkdir -p Data/Persistent Data/Temporary/Testing
            phpstan-command: bin/phpstan analyse -c ../neos.neon -vvv
            baseline-file: neos-baseline.neon
          - php-version: 8.5
            repo: neos/flow-development-collection
            ref: b8cf3a3665171c45a598669b8fcadd35b6354fa3
            phpstan-cwd: e2e/integration/flow-dist
            setup: |
              # Flow is a monorepo package collection like Neos. PHPStan must run
              # from within a Flow distribution where the collection is split into
              # Packages/Framework. This mirrors how Flow runs PHPStan in its own CI:
              # https://github.com/neos/flow-development-collection/blob/9.3/.github/workflows/build.yml
              git checkout -b build
              git clone https://github.com/neos/flow-development-distribution.git ../flow-dist
              cd ../flow-dist
              git checkout 513fa6dabed817c29a3686e12b8b5178e8e10613
              composer config repositories.flow '{ "type": "path", "url": "../repo", "options": { "symlink": false } }'
              composer require --no-update neos/flow-development-collection:"dev-build as 9.3.x-dev"
              composer update --no-progress --no-interaction
              cp ../../../phpstan.phar Packages/Libraries/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan Packages/Libraries/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php Packages/Libraries/phpstan/phpstan/bootstrap.php
              rm -rf Packages/Libraries/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext Packages/Libraries/phpstan/phpstan/turbo-ext
              # Flow's bootstrap (run by bootstrap-phpstan.php in every parallel
              # worker) creates these directories non-atomically and exits on a
              # lost mkdir race - create them upfront.
              mkdir -p Data/Persistent Data/Temporary/Testing
            phpstan-command: bin/phpstan analyse -c ../flow.neon
            baseline-file: flow-baseline.neon
          - php-version: 8.5
            repo: neos/flow-development-collection
            ref: 72ea7c8fb608515939c6d9576829ca635d16ee26
            phpstan-cwd: e2e/integration/flow-dist
            setup: |
              # Flow also lints a second set of packages at level 3 (phpstan-legacy.neon.dist).
              # Flow 9.3 removed that file, so this entry stays on a 9.2 revision.
              git checkout -b build
              git clone https://github.com/neos/flow-development-distribution.git ../flow-dist
              cd ../flow-dist
              git checkout 9165cc61c0e349e81d9da1617244e58153c51ad5
              composer config repositories.flow '{ "type": "path", "url": "../repo", "options": { "symlink": false } }'
              composer require --no-update neos/flow-development-collection:"dev-build as 9.2.x-dev"
              composer update --no-progress --no-interaction
              cp ../../../phpstan.phar Packages/Libraries/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan Packages/Libraries/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php Packages/Libraries/phpstan/phpstan/bootstrap.php
              rm -rf Packages/Libraries/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext Packages/Libraries/phpstan/phpstan/turbo-ext
              # Flow's bootstrap (run by bootstrap-phpstan.php in every parallel
              # worker) creates these directories non-atomically and exits on a
              # lost mkdir race - create them upfront.
              mkdir -p Data/Persistent Data/Temporary/Testing
            phpstan-command: bin/phpstan analyse -c ../flow-legacy.neon
            baseline-file: flow-legacy-baseline.neon
          - php-version: 8.5
            repo: nunomaduro/dev-null.sh
            ref: bf8975ef50dd629dd1decd4e7605cd272780d638
            setup: |
