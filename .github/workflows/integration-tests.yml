          - php-version: 8.5
            repo: mailpoet/mailpoet
            ref: 7b7888de0107fdd5d93a7394ad3a5061ea7fabfa
            # PHPStan runs from tasks/phpstan, which has its own vendor/ with the PHPStan extensions,
            # the same as `./do qa:phpstan`
            phpstan-cwd: e2e/integration/repo/mailpoet/tasks/phpstan
            setup: |
              # mirrors .github/workflows/build.yml in MailPoet
              cd mailpoet
              COMPOSER_DEV_MODE=1 php tools/install.php
              touch .env
              ./tools/vendor/composer.phar install
              # MailPoet pins phpstan-doctrine 2.0.28, which serialize()s types and crashes intermittently
              # with "Serialization of 'Closure' is not allowed" (https://github.com/phpstan/phpstan/issues/15687)
              ./tools/vendor/composer.phar --working-dir=tasks/phpstan require --no-interaction phpstan/phpstan-doctrine:2.1.2
              php -d register_argc_argv=1 ../tests_env/vendor/bin/codecept build
            phpstan-command: ../../../../../../phpstan.phar analyse -c ../../../../mailpoet.neon --memory-limit=4G ../../lib ../../tests/_support ../../tests/DataFactories ../../tests/acceptance ../../tests/integration ../../tests/unit
            baseline-file: mailpoet-baseline.neon
          - php-version: 8.4
            repo: aws/aws-sdk-php
            ref: 3.403.5
            setup: |
              composer install
            phpstan-command: ../../../phpstan.phar analyse -c ../aws-sdk-php.neon --memory-limit=2G
            baseline-file: aws-sdk-php-baseline.neon
          - php-version: 8.4
            repo: symfony/symfony
            ref: ae0a0c11d2e8d2654f019526076cdb9972671cc3
            setup: |
              # mirrors the PHPStan job in Symfony's .github/workflows/static-analysis.yml
              export COMPOSER_ROOT_VERSION=8.2.x-dev
              # avoids non-ignorable errors: lets PHPStan see that a few methods always return, and regenerates
              # RedisProxy and RedisClusterProxy from phpredis 6c1fbf86ae, which fixed the RedisCluster return types
              # that phpstorm-stubs already have
              git apply ../symfony.patch
              composer remove --dev --no-update --no-interaction symfony/phpunit-bridge
              # composer/composer is needed by the Runtime component's ComposerPlugin
              composer require --dev --no-progress --no-plugins --no-interaction --ignore-platform-req=ext-mongodb phpstan/phpstan-deprecation-rules phpunit/phpunit:^11.5 php-http/discovery psr/event-dispatcher mongodb/mongodb composer/composer
              # PHPUnit 9 symbols used by the PhpUnit bridge, removed in PHPUnit 10, scanned via symfony.neon
              mkdir .phpunit9
              for f in Framework/TestListener.php Framework/TestListenerDefaultImplementation.php TextUI/Command.php; do
                curl -fsSL "https://raw.githubusercontent.com/sebastianbergmann/phpunit/9.6.37/src/$f" -o ".phpunit9/$(basename "$f")"
              done
            # the autoload file makes Symfony's custom rules in .github/sa-tools/rules loadable
            phpstan-command: ../../../phpstan.phar analyse -c ../symfony.neon --autoload-file=.github/sa-tools/rules/bootstrap.php --memory-limit=2G
            baseline-file: symfony-baseline.neon
