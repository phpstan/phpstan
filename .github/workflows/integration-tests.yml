# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Integration tests" # zizmor: ignore[concurrency-limits] concurrency is set by the calling workflow

on:
  workflow_call:
    inputs:
      ref:
        description: 'phpstan/phpstan ref to checkout'
        required: true
        type: string
      phar-checksum:
        description: 'PHAR checksum from reproducible build (please rebase)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-phar-checksum:
    name: "Check PHAR checksum"
    runs-on: "ubuntu-latest"
    outputs:
      checksum-result: ${{ steps.checksum-difference.outputs.result }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: "Check PHAR checksum"
        id: checksum-difference
        env:
          CHECKSUM: ${{ inputs.phar-checksum }}
        run: |
          if [[ $(head -n 1 .phar-checksum) != "$CHECKSUM" ]]; then
            echo "result=different" >> "$GITHUB_OUTPUT"
          else
            echo "result=same" >> "$GITHUB_OUTPUT"
          fi

  integration-tests:
    name: "Integration - ${{ matrix.name }}"

    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    needs: check-phar-checksum
    if: "needs.check-phar-checksum.outputs.checksum-result == 'different'"

    # https://docs.github.com/en/free-pro-team@latest/actions/guides/about-service-containers
    services:
      database:
        # see https://hub.docker.com/_/mysql
        image: "${{ matrix.mysql }}"
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3'

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: 8.4
            name: Rector tests
            script: |
              git clone https://github.com/rectorphp/rector-src.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 9e6021d0168e79c71c16b6735a8dd4ef158a1c9f
              cp ../rector-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              rm -rf vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext vendor/phpstan/phpstan/turbo-ext
              # with this repository's vendor/ four levels up, bin/rector.php thinks it is a split package and loads both preload files
              rm -rf ../../../vendor
              vendor/bin/phpunit
          - php-version: 8.4
            name: Rector downgrade PHP tests
            script: |
              git clone https://github.com/rectorphp/rector-downgrade-php.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 9cfaea022907d705d23937ba9266ccfa9e02d59a
              cp ../rector-downgrade-php-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              rm -rf vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext vendor/phpstan/phpstan/turbo-ext
              vendor/bin/phpunit
          - php-version: 8.4
            name: Symplify tests
            script: |
              git clone https://github.com/symplify/phpstan-rules.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout c402ae581315a83139bfc53c40c00d51e821cb70
              cp ../symplify-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              rm -rf vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext vendor/phpstan/phpstan/turbo-ext
              vendor/bin/phpunit
          - php-version: 8.4
            name: Larastan tests PHP 8.4, ^13.42
            script: |
              git clone https://github.com/larastan/larastan.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout e8a6b580b7b52cb38a717f5da6b9f34bd9c610f1
              cp ../larastan-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              rm -rf vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext vendor/phpstan/phpstan/turbo-ext
              composer run-script test:unit
          - php-version: 8.5
            name: phpstan-laravel tests
            script: |
              git clone https://github.com/calebdw/phpstan-laravel.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 8b55dd06ee36403fd8282157c8459f37d38ded6a
              cp ../phpstan-laravel-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              rm -rf vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext vendor/phpstan/phpstan/turbo-ext
              composer run-script test:unit
          - php-version: 8.4
            name: Carbon tests
            script: |
              git clone https://github.com/briannesbitt/Carbon.git -b 3.15.1 --depth 1 e2e/integration/repo
              cd e2e/integration/repo
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              rm -rf vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext vendor/phpstan/phpstan/turbo-ext
              vendor/bin/phpunit tests/PHPStan
          - php-version: 8.1
            name: shipmonk/phpstan-rules tests
            script: |
              git clone https://github.com/shipmonk-rnd/phpstan-rules.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 5c18620a1469b8fee8fd6a975a20e3d1705e41ad
              # the upstream lock has nette/utils v4.1.4, which requires PHP 8.2
              composer update nette/utils nette/schema
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              rm -rf vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext vendor/phpstan/phpstan/turbo-ext
              vendor/bin/phpunit tests
          - php-version: 8.4
            name: shipmonk/dead-code-detector tests
            script: |
              git clone https://github.com/shipmonk-rnd/dead-code-detector.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 79a0408978a321ce1a39ca61774aee0163eb469a
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              rm -rf vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext vendor/phpstan/phpstan/turbo-ext
              vendor/bin/phpunit tests
#          - php-version: 8.4
#            name: efabrica-team/phpstan-latte tests
#            script: |
#              git clone https://github.com/efabrica-team/phpstan-latte.git --depth 1 -b 0.19.0 e2e/integration/repo
#              cd e2e/integration/repo
#              composer install
#              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
#              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
#              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
#              vendor/bin/phpunit
          - php-version: 8.2
            name: Bladestan tests
            script: |
              git clone https://github.com/bladestan/bladestan.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 9be037cd1c505d6952ec6eb5f7f50e13fc61efed
              cp ../bladestan-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              rm -rf vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext vendor/phpstan/phpstan/turbo-ext
              vendor/bin/phpunit
          - php-version: 8.5
            name: Prado tests
            script: |
              git clone https://github.com/pradosoft/prado.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 42c3e9ee423846439548cb11fe1f37931aafac30
              composer install
              composer require --dev phpstan/phpstan
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              rm -rf vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext vendor/phpstan/phpstan/turbo-ext
              vendor/bin/phpunit --testsuite phpstan
          - php-version: 8.5
            name: phpstan-dba tests
            mysql: 'mysql:8.4.9@sha256:c36050afdca850f23cef85703f84c7531a5ae155a11b5ee1c60acb09937c4084' # 8.4.9
            script: |
              git clone https://github.com/staabm/phpstan-dba.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 594dc1fe9831ce551371ecdfc2acf1377abcc9b0
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              rm -rf vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext vendor/phpstan/phpstan/turbo-ext
              mysql -uroot -h127.0.0.1 -proot < tests/schema.sql
              composer require sqlftw/sqlftw
              composer require doctrine/dbal:^4
              DBA_REFLECTOR=pdo-mysql DBA_MODE=recording composer run phpunit

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          ini-file: development

      - name: "Install Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Download phpstan.phar"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phar-file

      - name: "Download turbo extension"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: turbo-ext-files
          path: turbo-ext

      - name: "Tests"
        run: "${{ matrix.script }}" # zizmor: ignore[template-injection] scripts are defined statically in the matrix
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1

  integration-run-phpstan:
    name: "Integration - ${{ matrix.repo }}"

    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    needs: check-phar-checksum
    if: "needs.check-phar-checksum.outputs.checksum-result == 'different'"

    # https://docs.github.com/en/free-pro-team@latest/actions/guides/about-service-containers
    services:
      database:
      # see https://hub.docker.com/_/mysql
        image: "${{ matrix.mysql }}"
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3'

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: 8.4
            repo: rectorphp/rector-src
            ref: 9e6021d0168e79c71c16b6735a8dd4ef158a1c9f
            setup: |
              cp ../rector-composer.lock composer.lock
              composer install
            phpstan-command: ../../../phpstan.phar analyse -c ../rector.neon -vvv
            baseline-file: rector-baseline.neon
          - php-version: 8.4
            repo: rectorphp/rector-downgrade-php
            ref: 9cfaea022907d705d23937ba9266ccfa9e02d59a
            setup: |
              cp ../rector-downgrade-php-composer.lock composer.lock
              COMPOSER_ROOT_VERSION=dev-main composer install
            phpstan-command: ../../../phpstan.phar analyse -c ../rector-downgrade-php.neon
            baseline-file: rector-downgrade-php-baseline.neon
          - php-version: 8.4
            repo: sebastianbergmann/phpunit
            ref: 13.4.7
            setup: |
              export COMPOSER_ROOT_VERSION=13.4.7
              composer install
              composer install --working-dir tools/.phpstan
              cp ../../../phpstan.phar tools/.phpstan/vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan tools/.phpstan/vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php tools/.phpstan/vendor/phpstan/phpstan/bootstrap.php
              rm -rf tools/.phpstan/vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext tools/.phpstan/vendor/phpstan/phpstan/turbo-ext
            phpstan-command: tools/.phpstan/vendor/bin/phpstan analyse -c ../phpunit.neon
            baseline-file: phpunit-baseline.neon
          - php-version: 8.4
            repo: laravel/framework
            ref: 94f01e85452dd9ea24853689912f026fc78ff878
            setup: |
              composer install
            phpstan-command: ../../../phpstan.phar analyse -c ../laravel.neon -vvv
            baseline-file: laravel-baseline.neon
          - php-version: 8.4
            repo: laravel/framework
            ref: 94f01e85452dd9ea24853689912f026fc78ff878
            setup: |
              composer install
            phpstan-command: ../../../phpstan.phar analyse -c ../laravel-types.neon -vvv
            baseline-file: laravel-types-baseline.neon
          - php-version: 8.4
            repo: Roave/BetterReflection
            ref: 6d05df14b04ec682226ed0525e4fbfb6db7dccc5
            setup: |
              composer install
              composer install --working-dir tools
              cp ../../../phpstan.phar tools/vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan tools/vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php tools/vendor/phpstan/phpstan/bootstrap.php
              rm -rf tools/vendor/phpstan/phpstan/turbo-ext && cp -R ../../../turbo-ext tools/vendor/phpstan/phpstan/turbo-ext
            phpstan-command: tools/vendor/bin/phpstan analyse -c ../better-reflection.neon
            baseline-file: better-reflection-baseline.neon
#          - php-version: 8.1
