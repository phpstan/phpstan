# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Integration tests"

on:
  workflow_call:
    inputs:
      ref:
        description: 'phpstan/phpstan ref to checkout'
        required: true
        type: string
      phar-checksum:
        description: 'PHAR checksum from reproducible build (please rebase)'
        required: true
        type: string
    secrets:
      phpstan-bot-token:
        required: false

jobs:
  check-phar-checksum:
    name: "Check PHAR checksum"
    runs-on: "ubuntu-latest"
    outputs:
      checksum-result: ${{ steps.checksum-difference.outputs.result }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}
      - name: "Check PHAR checksum"
        id: checksum-difference
        run: |
          checksum="${{ inputs.phar-checksum }}"
          if [[ $(head -n 1 .phar-checksum) != "$checksum" ]]; then
            echo "result=different" >> "$GITHUB_OUTPUT"
          else
            echo "result=same" >> "$GITHUB_OUTPUT"
          fi

  integration-tests:
    name: "Integration - ${{ matrix.name }}"

    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    needs: check-phar-checksum
    if: "needs.check-phar-checksum.outputs.checksum-result == 'different'"

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: 8.4
            name: Rector tests
            script: |
              git clone https://github.com/rectorphp/rector-src.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 2.3.2
              cp ../rector-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit
          - php-version: 8.4
            name: Rector downgrade PHP tests
            script: |
              git clone https://github.com/rectorphp/rector-downgrade-php.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout a110e2fcf94e7513739f54bc27cd473ba9eff5d5
              cp ../rector-downgrade-php-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit
          - php-version: 8.4
            name: Symplify tests
            script: |
              git clone https://github.com/symplify/phpstan-rules.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 947b9c72900454bb0a13c461456be116acc9e258
              cp ../symplify-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit
          - php-version: 8.4
            name: Larastan tests PHP 8.4, ^12.48
            script: |
              git clone https://github.com/larastan/larastan.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 0ac2cfa87ac815a460918b0331b77d9f9e9b863d
              cp ../larastan-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              composer run-script test:unit
          - php-version: 8.4
            name: Carbon tests
            script: |
              git clone https://github.com/briannesbitt/Carbon.git -b 3.10.3 --depth 1 e2e/integration/repo
              cd e2e/integration/repo
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit tests/PHPStan
          - php-version: 8.1
            name: shipmonk/phpstan-rules tests
            script: |
              git clone https://github.com/shipmonk-rnd/phpstan-rules.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 7223e6b64741f4b01c7f3c4af1604b485e11fff5
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit tests
          - php-version: 8.4
            name: shipmonk/dead-code-detector tests
            script: |
              git clone https://github.com/shipmonk-rnd/dead-code-detector.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 9dc312dacd817f253a9519703d2c4c3d86579d27
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit tests
#          - php-version: 8.4
#            name: efabrica-team/phpstan-latte tests
#            script: |
#              git clone https://github.com/efabrica-team/phpstan-latte.git --depth 1 -b 0.19.0 e2e/integration/repo
#              cd e2e/integration/repo
#              composer install
#              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
#              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
#              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
#              vendor/bin/phpunit
          - php-version: 8.2
            name: Bladestan tests
            script: |
              git clone https://github.com/bladestan/bladestan.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout f1dedaeb283718cf78ac02ba4d013d3a3b86eda1
              cp ../bladestan-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}

      - name: "Install PHP"
        uses: "shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1" # v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          ini-file: development

      - name: "Install Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - uses: "ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520" # v3

      - name: "Download phpstan.phar"
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
          with: |
            name: phar-file
          attempt_limit: 5
          attempt_delay: 1000

      - name: "Tests"
        run: "${{ matrix.script }}"
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1

  integration-run-phpstan:
    name: "Integration - ${{ matrix.repo }}"

    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    needs: check-phar-checksum
    if: "needs.check-phar-checksum.outputs.checksum-result == 'different'"

    strategy:
      fail-fast: false
      matrix:
