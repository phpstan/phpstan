# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Integration tests"

on:
  workflow_call:
    inputs:
      ref:
        description: 'phpstan/phpstan ref to checkout'
        required: true
        type: string
      phar-checksum:
        description: 'PHAR checksum from reproducible build (please rebase)'
        required: true
        type: string
    secrets:
      phpstan-bot-token:
        required: false

jobs:
  check-phar-checksum:
    name: "Check PHAR checksum"
    runs-on: "ubuntu-latest"
    outputs:
      checksum-result: ${{ steps.checksum-difference.outputs.result }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}
      - name: "Check PHAR checksum"
        id: checksum-difference
        run: |
          checksum="${{ inputs.phar-checksum }}"
          if [[ $(head -n 1 .phar-checksum) != "$checksum" ]]; then
            echo "result=different" >> "$GITHUB_OUTPUT"
          else
            echo "result=same" >> "$GITHUB_OUTPUT"
          fi

  integration-tests:
    name: "Integration - ${{ matrix.name }}"

    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    needs: check-phar-checksum
    if: "needs.check-phar-checksum.outputs.checksum-result == 'different'"

    # https://docs.github.com/en/free-pro-team@latest/actions/guides/about-service-containers
    services:
      database:
        # see https://hub.docker.com/_/mysql
        image: 'mysql:8.4.9@sha256:c36050afdca850f23cef85703f84c7531a5ae155a11b5ee1c60acb09937c4084' # 8.4.9
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3'

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: 8.4
            name: Rector tests
            script: |
              git clone https://github.com/rectorphp/rector-src.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 6fe25a47e43fd0b0cd1ea391d1d4412d1e129182
              cp ../rector-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit
          - php-version: 8.4
            name: Rector downgrade PHP tests
            script: |
              git clone https://github.com/rectorphp/rector-downgrade-php.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 77ccf646e697589619b4dda07865b1d638b64b83
              cp ../rector-downgrade-php-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit
          - php-version: 8.4
            name: Symplify tests
            script: |
              git clone https://github.com/symplify/phpstan-rules.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 947b9c72900454bb0a13c461456be116acc9e258
              cp ../symplify-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit
          - php-version: 8.4
            name: Larastan tests PHP 8.4, ^12.48
            script: |
              git clone https://github.com/larastan/larastan.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 2970f83398154178a739609c244577267c7ee8eb
              cp ../larastan-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              composer run-script test:unit
          - php-version: 8.4
            name: Carbon tests
            script: |
              git clone https://github.com/briannesbitt/Carbon.git -b 3.10.3 --depth 1 e2e/integration/repo
              cd e2e/integration/repo
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit tests/PHPStan
          - php-version: 8.1
            name: shipmonk/phpstan-rules tests
            script: |
              git clone https://github.com/shipmonk-rnd/phpstan-rules.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 7223e6b64741f4b01c7f3c4af1604b485e11fff5
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit tests
          - php-version: 8.4
            name: shipmonk/dead-code-detector tests
            script: |
              git clone https://github.com/shipmonk-rnd/dead-code-detector.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 9dc312dacd817f253a9519703d2c4c3d86579d27
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit tests
#          - php-version: 8.4
#            name: efabrica-team/phpstan-latte tests
#            script: |
#              git clone https://github.com/efabrica-team/phpstan-latte.git --depth 1 -b 0.19.0 e2e/integration/repo
#              cd e2e/integration/repo
#              composer install
#              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
#              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
#              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
#              vendor/bin/phpunit
          - php-version: 8.2
            name: Bladestan tests
            script: |
              git clone https://github.com/bladestan/bladestan.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout f1dedaeb283718cf78ac02ba4d013d3a3b86eda1
              cp ../bladestan-composer.lock composer.lock
              composer install
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit
          - php-version: 8.5
            name: Prado tests
            script: |
              git clone https://github.com/pradosoft/prado.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 56d62b850ec51a5eee6298a8fb26134950725a21
              composer install
              composer require --dev phpstan/phpstan
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              vendor/bin/phpunit --testsuite phpstan
          - php-version: 8.5
            name: phpstan-dba tests
            script: |
              git clone https://github.com/staabm/phpstan-dba.git e2e/integration/repo
              cd e2e/integration/repo
              git checkout 42562f5a908c149393cae041e3a57b7c8f0ac982
              composer install
              composer require --dev phpstan/phpstan
              cp ../../../phpstan.phar vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php vendor/phpstan/phpstan/bootstrap.php
              mysql -uroot -h127.0.0.1 -proot < tests/schema.sql
              composer run phpunit

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}

      - name: "Install PHP"
        uses: "shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc" # v2.37.1
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          ini-file: development

      - name: "Install Node"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Download phpstan.phar"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phar-file

      - name: "Tests"
        run: "${{ matrix.script }}"
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1

  integration-run-phpstan:
    name: "Integration - ${{ matrix.repo }}"

    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    needs: check-phar-checksum
