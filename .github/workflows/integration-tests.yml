          - php-version: 8.4
            repo: sebastianbergmann/phpunit
            ref: 12.4.5
            setup: |
              export COMPOSER_ROOT_VERSION=12.4.5
              composer install
              composer install --working-dir tools/.phpstan
              cp ../../../phpstan.phar tools/.phpstan/vendor/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan tools/.phpstan/vendor/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php tools/.phpstan/vendor/phpstan/phpstan/bootstrap.php
            phpstan-command: tools/.phpstan/vendor/bin/phpstan analyse -c ../phpunit.neon
            baseline-file: phpunit-baseline.neon
          - php-version: 8.2
            repo: laravel/framework
            ref: 00f0216e493867f399401397cc40347f869a7e1e
            setup: |
              composer install
            phpstan-command: ../../../phpstan.phar analyse -c ../laravel.neon
