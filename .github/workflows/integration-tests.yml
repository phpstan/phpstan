    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}

      - name: "Install PHP"
        uses: "shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1" # v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          ini-file: development

      - uses: "ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520" # v3

      - name: "Download phpstan.phar"
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
          with: |
            name: phar-file
          attempt_limit: 5
          attempt_delay: 1000

      - name: "Checkout project"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: "${{ matrix.repo }}"
          ref: "${{ matrix.ref }}"
          path: e2e/integration/repo

      - name: "Setup"
        working-directory: e2e/integration/repo
        run: "${{ matrix.setup }}"
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1

      - name: "PHPStan"
        working-directory: ${{ matrix.phpstan-cwd || 'e2e/integration/repo' }}
        run: "${{ matrix.phpstan-command }}"

      - name: "Generate baseline"
        if: ${{ failure() }}
        working-directory: ${{ matrix.phpstan-cwd || 'e2e/integration/repo' }}
        run: "${{ matrix.phpstan-command }} -b ../${{ matrix.baseline-file }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: baselines-${{ matrix.baseline-file }}
          path: "e2e/integration/${{ matrix.baseline-file }}"

  integration-update-baseline:
    name: "Integration - Update baselines"
    runs-on: "ubuntu-latest"
    needs: [integration-run-phpstan, pmmp-tests]
    if: "failure() && github.repository_owner == 'phpstan' && inputs.ref == 'refs/heads/2.1.x'"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}
          token: ${{ secrets.phpstan-bot-token }}

      - name: "Download baselines"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: baselines-*
          merge-multiple: true
          path: "e2e/integration"

      - name: "Create Pull Request"
        id: create-pr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.phpstan-bot-token }}
          branch: "create-pull-request/baselines-2.2.x"
          delete-branch: true
          title: "Update baselines for ${{ inputs.ref }}"
          committer: "phpstan-bot <ondrej+phpstanbot@mirtes.cz>"
          commit-message: "Update baselines"

  pmmp-tests:
    name: "PMMP Tests"

    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    needs: check-phar-checksum
    if: "needs.check-phar-checksum.outputs.checksum-result == 'different'"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}

      - name: Setup PHP
        uses: pmmp/setup-php-action@3c38c259834f945351a662392836d90eb08abff0 # 3.2.0
        with:
          php-version: 8.4
          install-path: "./bin"
          pm-version-major: "5"

      - uses: "ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520" # v3

      - name: "Download phpstan.phar"
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
          with: |
            name: phar-file
          attempt_limit: 5
          attempt_delay: 1000

      - name: "Checkout PMMP"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: "pmmp/PocketMine-MP"
          ref: 5.37.3
          path: e2e/integration/repo

      - name: "Install dependencies"
        uses: "ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520" # v3
        with:
          working-directory: "e2e/integration/repo"

      - name: "PHPStan"
        working-directory: "e2e/integration/repo"
        run: ../../../phpstan.phar analyse -c ../pocketmine-ng.neon --memory-limit=2G

      - name: "Generate baseline"
        if: ${{ failure() }}
        working-directory: "e2e/integration/repo"
        run: ../../../phpstan.phar analyse -c ../pocketmine-ng.neon --memory-limit=2G -b ../pocketmine-ng-baseline.neon

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: pocketmine-ng-baseline.neon
          path: e2e/integration/pocketmine-ng-baseline.neon
