    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          ini-file: development

      - name: "Install Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Download phpstan.phar"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phar-file

      - name: "Download turbo extension"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: turbo-ext-files
          path: turbo-ext

      - name: "Checkout project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ matrix.repo }}"
          ref: "${{ matrix.ref }}"
          path: e2e/integration/repo
          persist-credentials: false

      - name: "Setup"
        working-directory: e2e/integration/repo
        run: "${{ matrix.setup }}" # zizmor: ignore[template-injection] scripts are defined statically in the matrix
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1

      - name: "PHPStan"
        working-directory: ${{ matrix.phpstan-cwd || 'e2e/integration/repo' }}
        run: "${{ matrix.phpstan-command }}" # zizmor: ignore[template-injection] commands are defined statically in the matrix

      - name: "Generate baseline"
        if: ${{ failure() && matrix.baseline-file }}
        working-directory: ${{ matrix.phpstan-cwd || 'e2e/integration/repo' }}
        run: '${{ matrix.phpstan-command }} -b "$GITHUB_WORKSPACE/e2e/integration/${{ matrix.baseline-file }}"' # zizmor: ignore[template-injection] commands are defined statically in the matrix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() && matrix.baseline-file }}
        with:
          name: baselines-${{ matrix.baseline-file }}
          path: "e2e/integration/${{ matrix.baseline-file }}"

  pmmp-tests:
    name: "PMMP Tests"

    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    needs: check-phar-checksum
    if: "needs.check-phar-checksum.outputs.checksum-result == 'different'"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup PHP
        uses: pmmp/setup-php-action@3c38c259834f945351a662392836d90eb08abff0 # 3.2.0
        with:
          php-version: 8.4
          install-path: "./bin"
          pm-version-major: "5"

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Download phpstan.phar"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phar-file

      - name: "Download turbo extension"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: turbo-ext-files
          path: turbo-ext

      - name: "Checkout PMMP"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "pmmp/PocketMine-MP"
          ref: 5.44.3
          path: e2e/integration/repo
          persist-credentials: false

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0
        with:
          working-directory: "e2e/integration/repo"

      - name: "PHPStan"
        working-directory: "e2e/integration/repo"
        run: ../../../phpstan.phar analyse -c ../pocketmine-ng.neon --memory-limit=2G -vvv

      - name: "Generate baseline"
        if: ${{ failure() }}
        working-directory: "e2e/integration/repo"
        run: ../../../phpstan.phar analyse -c ../pocketmine-ng.neon --memory-limit=2G -b ../pocketmine-ng-baseline.neon

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: baselines-pocketmine-ng.neon
          path: e2e/integration/pocketmine-ng-baseline.neon
