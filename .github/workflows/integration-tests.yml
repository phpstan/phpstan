              # derive the root version and the monorepo's "replace: typo3/cms-*"
              # entries stop satisfying typo3/testing-framework's requirements.
              COMPOSER_ROOT_VERSION=14.0.x-dev composer install
            phpstan-command: ../../../phpstan.phar analyse -c ../typo3.neon --memory-limit=2G
