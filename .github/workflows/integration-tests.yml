              # Packages/Neos and the Flow framework into Packages/Framework
              # (its phpstan.neon.dist references ../Framework/bootstrap-phpstan.php).
              # This mirrors how Neos runs PHPStan in its own CI:
              # https://github.com/neos/neos-development-collection/blob/9.2/.github/workflows/build.yml
              git checkout -b build
              git clone https://github.com/neos/neos-development-distribution.git ../neos-dist
              cd ../neos-dist
              git checkout 8327d571dce4a2de6ab7788bb415cbf1a706bb39
              composer config repositories.neos '{ "type": "path", "url": "../repo", "options": { "symlink": false } }'
              composer require --no-update neos/neos-development-collection:"dev-build as 9.2.x-dev"
              composer update --no-progress --no-interaction
              cp ../../../phpstan.phar Packages/Libraries/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan Packages/Libraries/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php Packages/Libraries/phpstan/phpstan/bootstrap.php
            phpstan-command: bin/phpstan analyse -c ../neos.neon
            baseline-file: neos-baseline.neon
          - php-version: 8.5
            repo: neos/flow-development-collection
            ref: 72ea7c8fb608515939c6d9576829ca635d16ee26
            phpstan-cwd: e2e/integration/flow-dist
            setup: |
              # Flow is a monorepo package collection like Neos. PHPStan must run
              # from within a Flow distribution where the collection is split into
              # Packages/Framework. This mirrors how Flow runs PHPStan in its own CI:
              # https://github.com/neos/flow-development-collection/blob/9.2/.github/workflows/build.yml
              git checkout -b build
              git clone https://github.com/neos/flow-development-distribution.git ../flow-dist
              cd ../flow-dist
              git checkout 9165cc61c0e349e81d9da1617244e58153c51ad5
              composer config repositories.flow '{ "type": "path", "url": "../repo", "options": { "symlink": false } }'
              composer require --no-update neos/flow-development-collection:"dev-build as 9.2.x-dev"
              composer update --no-progress --no-interaction
              cp ../../../phpstan.phar Packages/Libraries/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan Packages/Libraries/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php Packages/Libraries/phpstan/phpstan/bootstrap.php
            phpstan-command: bin/phpstan analyse -c ../flow.neon
            baseline-file: flow-baseline.neon
          - php-version: 8.5
            repo: neos/flow-development-collection
            ref: 72ea7c8fb608515939c6d9576829ca635d16ee26
            phpstan-cwd: e2e/integration/flow-dist
            setup: |
              # Flow also lints a second set of packages at level 3 (phpstan-legacy.neon.dist).
              git checkout -b build
              git clone https://github.com/neos/flow-development-distribution.git ../flow-dist
              cd ../flow-dist
              git checkout 9165cc61c0e349e81d9da1617244e58153c51ad5
              composer config repositories.flow '{ "type": "path", "url": "../repo", "options": { "symlink": false } }'
              composer require --no-update neos/flow-development-collection:"dev-build as 9.2.x-dev"
              composer update --no-progress --no-interaction
              cp ../../../phpstan.phar Packages/Libraries/phpstan/phpstan/phpstan.phar
              cp ../../../phpstan Packages/Libraries/phpstan/phpstan/phpstan
              cp ../../../bootstrap.php Packages/Libraries/phpstan/phpstan/bootstrap.php
            phpstan-command: bin/phpstan analyse -c ../flow-legacy.neon
            baseline-file: flow-legacy-baseline.neon
          - php-version: 8.5
            repo: staabm/phpstan-dba
            ref: 42562f5a908c149393cae041e3a57b7c8f0ac982
            setup: |
              composer install
              mysql -uroot -h127.0.0.1 -proot < tests/schema.sql
            phpstan-command: ../../../phpstan.phar analyse -c ../phpstan-dba.neon
            baseline-file: phpstan-dba-baseline.neon

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}

      - name: "Install PHP"
        uses: "shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc" # v2.37.1
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          ini-file: development

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Download phpstan.phar"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phar-file

      - name: "Checkout project"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "${{ matrix.repo }}"
          ref: "${{ matrix.ref }}"
          path: e2e/integration/repo

      - name: "Setup"
        working-directory: e2e/integration/repo
        run: "${{ matrix.setup }}"
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1

      - name: "PHPStan"
        working-directory: ${{ matrix.phpstan-cwd || 'e2e/integration/repo' }}
        run: "${{ matrix.phpstan-command }}"

      - name: "Generate baseline"
        if: ${{ failure() }}
        working-directory: ${{ matrix.phpstan-cwd || 'e2e/integration/repo' }}
        run: "${{ matrix.phpstan-command }} -b ../${{ matrix.baseline-file }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: baselines-${{ matrix.baseline-file }}
          path: "e2e/integration/${{ matrix.baseline-file }}"

  integration-update-baseline:
    name: "Integration - Update baselines"
    runs-on: "ubuntu-latest"
    needs: [integration-run-phpstan, pmmp-tests]
    if: "failure() && github.repository_owner == 'phpstan' && inputs.ref == 'refs/heads/2.2.x'"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}
          token: ${{ secrets.phpstan-bot-token }}

      - name: "Download baselines"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: baselines-*
          merge-multiple: true
          path: "e2e/integration"

      - name: "Create Pull Request"
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.phpstan-bot-token }}
          branch: "create-pull-request/baselines-2.2.x"
          delete-branch: true
          title: "Update baselines for ${{ inputs.ref }}"
          committer: "phpstan-bot <ondrej+phpstanbot@mirtes.cz>"
          commit-message: "Update baselines"

  pmmp-tests:
    name: "PMMP Tests"

    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    needs: check-phar-checksum
    if: "needs.check-phar-checksum.outputs.checksum-result == 'different'"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "phpstan/phpstan"
          ref: ${{ inputs.ref }}

      - name: Setup PHP
        uses: pmmp/setup-php-action@3c38c259834f945351a662392836d90eb08abff0 # 3.2.0
        with:
          php-version: 8.4
          install-path: "./bin"
          pm-version-major: "5"

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Download phpstan.phar"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phar-file

      - name: "Checkout PMMP"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "pmmp/PocketMine-MP"
          ref: 5.37.3
          path: e2e/integration/repo

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0
        with:
          working-directory: "e2e/integration/repo"

      - name: "PHPStan"
        working-directory: "e2e/integration/repo"
        run: ../../../phpstan.phar analyse -c ../pocketmine-ng.neon --memory-limit=2G

      - name: "Generate baseline"
        if: ${{ failure() }}
        working-directory: "e2e/integration/repo"
        run: ../../../phpstan.phar analyse -c ../pocketmine-ng.neon --memory-limit=2G -b ../pocketmine-ng-baseline.neon

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: baselines-pocketmine-ng.neon
          path: e2e/integration/pocketmine-ng-baseline.neon
